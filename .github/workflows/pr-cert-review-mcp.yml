# Canonical copy — same as examples/github-workflow-pull-request-target-comment.yml
# Install: cp ci/github/pr-cert-review-mcp.yml .github/workflows/
name: "Pull Request cert-review (MCP)"
"on":
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.cxx"
      - "**/*.h"
      - "**/*.hpp"

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-cert-review-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run cert-review review-pr
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          IMAGE=raminnietzsche/cert-review-mcp:latest
          docker pull "$IMAGE"

          run_review() {
            docker run --rm \
              --entrypoint cert-review \
              -w "$GITHUB_WORKSPACE" \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              "$IMAGE" \
              review-pr \
                --repo "$GITHUB_WORKSPACE" \
                --base "$BASE" \
                --head "$HEAD" \
                --title "$PR_TITLE" \
                --profile ceph \
                --min-confidence 0.5 \
                --fail-on never \
                "$@" \
                -o cert-review-pr-comment.md
          }

          append_footer() {
            if ! grep -q 'cert-review-mcp · auto-generated' cert-review-pr-comment.md; then
              cat >> cert-review-pr-comment.md <<'EOF'

          <details>
          <summary>cert-review-mcp · auto-generated</summary>

          Report drafted with **[cert-review-mcp](https://github.com/RaminNietzsche/cert-review-mcp)** (`pull_request_target`). Findings are candidates; project QA and human review still apply.

          </details>
          EOF
            fi
          }

          if run_review --github-footer pull_request_target 2>/dev/null; then
            true
          else
            run_review
            append_footer
          fi

          test -s cert-review-pr-comment.md

      - name: Find existing cert-review comment
        uses: peter-evans/find-comment@v3
        id: find
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- cert-review -->"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: cert-review-pr-comment.md
          edit-mode: replace